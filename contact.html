<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .contact-container { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px; max-width: 900px; }
        .contact-info, .contact-form-section { flex: 1; min-width: 300px; }
        .info-block { margin-bottom: 20px; background-color: #f9f9f9; padding: 15px; border-radius: 5px; border-left: 5px solid #dc3545; }
        .info-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .form-group textarea { resize: vertical; height: 100px; }
        .submit-btn { background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .submit-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a> | 
        <a href="about.html">About</a> | 
        <a href="skills.html">Skills</a> | 
        <a href="projects.html">Projects</a> | 
        <b>Contact</b>
    </nav>
    <hr>
    <h1>Contact Me</h1>
    <div class="contact-container">
        <div class="contact-info">
            <h2>Get In Touch</h2>
            <div class="info-block">
                <div class="info-title">📍 Address</div>
                <div>123 Innovation Way, Suite 400<br>San Francisco, CA 94107<br>United States</div>
            </div>
            <div class="info-block">
                <div class="info-title">📞 Phone Number</div>
                <div>+1 (555) 019-2834</div>
            </div>
            <div class="info-block">
                <div class="info-title">✉️ Email</div>
                <div>contact@mydevportfolio.com</div>
            </div>
        </div>
        <div class="contact-form-section">
            <h2>Send a Message</h2>
            <form action="#" onsubmit="alert('Message sent successfully! (Demo Only)'); return false;">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Your Email Address">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" required placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
